<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ڕاپۆرتی فرۆشتن | ڕیکار ستۆر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kurdish:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-alt: #334155;
      --line: rgba(255,255,255,0.1);
      --text: #f8fafc;
      --muted: #94a3b8;
      --coral: #ff4d6d;
      --gold: #fbbf24;
      --green: #10b981;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Kurdish', 'IBM Plex Sans Arabic', sans-serif;
      padding: 15px;
      min-height: 100vh;
    }
    .container { max-width: 900px; margin: 0 auto; }
    
    /* Login Screen */
    #login-screen {
      min-height: 80vh; display: flex; align-items: center; justify-content: center;
    }
    .login-card {
      background: var(--surface); padding: 30px; border-radius: var(--radius);
      width: 100%; max-width: 380px; text-align: center; border: 1px solid var(--line);
    }
    .login-card h2 { color: var(--coral); margin-bottom: 20px; }
    .field { margin-bottom: 15px; text-align: right; }
    .field label { display: block; margin-bottom: 5px; font-size: 14px; color: var(--muted); }
    .field input, .field select {
      width: 100%; padding: 12px; background: var(--surface-alt); border: 1px solid var(--line);
      color: #fff; border-radius: 8px; font-family: inherit; font-size: 15px;
    }
    .btn {
      width: 100%; padding: 12px; background: var(--coral); color: #fff; border: none;
      border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px;
    }
    .btn-secondary { background: var(--surface-alt); color: var(--text); }
    
    /* Main Dashboard */
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; background: var(--surface); padding: 15px; border-radius: var(--radius);
    }
    header h1 { font-size: 20px; color: var(--gold); }
    
    .filter-section {
      background: var(--surface); padding: 15px; border-radius: var(--radius);
      margin-bottom: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px;
    }

    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px;
    }
    .stat-card {
      background: var(--surface); padding: 20px; border-radius: var(--radius); border: 1px solid var(--line);
    }
    .stat-card .label { font-size: 13px; color: var(--muted); margin-bottom: 5px; }
    .stat-card .value { font-size: 22px; font-weight: bold; color: var(--green); }

    .form-card {
      background: var(--surface); padding: 20px; border-radius: var(--radius); margin-bottom: 20px;
    }
    .form-card h3 { margin-bottom: 15px; color: var(--gold); font-size: 16px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .table-container {
      background: var(--surface); padding: 15px; border-radius: var(--radius); overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: right; }
    th, td { padding: 10px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; }
    
    .del-btn { color: var(--coral); cursor: pointer; background: none; border: none; font-size: 16px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <!-- Login -->
  <div id="login-screen">
    <div class="login-card">
      <h2>ڕیکار ستۆر</h2>
      <div class="field">
        <label>وشەی نهێنی</label>
        <input type="password" id="pass-input">
      </div>
      <button class="btn" onclick="login()">چوونەژوورەوە</button>
      <p id="login-err" style="color:var(--coral); margin-top:10px; display:none;">وشەی نهێنی هەڵەیە!</p>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="hidden">
    <header>
      <h1>سیستەمی ڕاپۆرتی ڕیکار ستۆر</h1>
      <button class="btn-secondary" style="padding:6px 12px; border-radius:6px;" onclick="logout()">دەرچوون</button>
    </header>

    <!-- Date Filter -->
    <div class="filter-section">
      <div>
        <label style="font-size:12px; color:var(--muted);">سەرەتای بەروار</label>
        <input type="date" id="start-date" onchange="loadData()">
      </div>
      <div>
        <label style="font-size:12px; color:var(--muted);">کۆتایی بەروار</label>
        <input type="date" id="end-date" onchange="loadData()">
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">کۆی گشتی فرۆش (دەنگ)</div>
        <div class="value" id="total-sales-count">0</div>
      </div>
      <div class="stat-card">
        <div class="label">کۆی داهات (د.ع)</div>
        <div class="value" id="total-revenue">0</div>
      </div>
    </div>

    <!-- New Sale Form -->
    <div class="form-card">
      <h3>زیادکردنی فرۆشتنی نوێ</h3>
      <div class="field">
        <label>ناوی کاڵا</label>
        <input type="text" id="p-name" placeholder="نموونە: بازن">
      </div>
      <div class="form-row">
        <div class="field">
          <label>ژمارە</label>
          <input type="number" id="p-qty" value="1">
        </div>
        <div class="field">
          <label>نرخی یەکە (د.ع)</label>
          <input type="number" id="p-price" value="15000">
        </div>
      </div>
      <button class="btn" onclick="addSale()">زیادکردنی فرۆشتن</button>
    </div>

    <!-- Sales List -->
    <div class="table-container">
      <h3 style="margin-bottom:10px;">لیستی فرۆشراوەکان</h3>
      <table>
        <thead>
          <tr>
            <th>کات</th>
            <th>کاڵا</th>
            <th>دانە</th>
            <th>کۆی نرخ</th>
            <th>لابردن</th>
          </tr>
        </thead>
        <tbody id="sales-table">
          <!-- Rows will go here -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const PASS = "rekarStoreSales2026";

  function login() {
    if(document.getElementById('pass-input').value === PASS) {
      sessionStorage.setItem('auth', '1');
      showDash();
    } else {
      document.getElementById('login-err').style.display = 'block';
    }
  }

  function logout() {
    sessionStorage.removeItem('auth');
    location.reload();
  }

  function showDash() {
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    setDefaultDates();
    loadData();
  }

  function setDefaultDates() {
    const today = new Date().toISOString().split('T')[0];
    const firstDay = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().split('T')[0];
    document.getElementById('start-date').value = firstDay;
    document.getElementById('end-date').value = today;
  }

  function getSales() {
    return JSON.parse(localStorage.getItem('rekar_sales') || '[]');
  }

  function addSale() {
    const name = document.getElementById('p-name').value;
    const qty = parseInt(document.getElementById('p-qty').value);
    const price = parseInt(document.getElementById('p-price').value);

    if(!name) return alert('تکایە ناوی کاڵا بنووسە');

    const newSale = {
      id: Date.now(),
      name,
      qty,
      price,
      total: qty * price,
      date: new Date().toISOString().split('T')[0],
      time: new Date().toLocaleTimeString('en-US', {hour12: false, hour: '2-digit', minute:'2-digit'})
    };

    const sales = getSales();
    sales.push(newSale);
    localStorage.setItem('rekar_sales', JSON.stringify(sales));

    document.getElementById('p-name').value = '';
    loadData();
  }

  function deleteSale(id) {
    let sales = getSales();
    sales = sales.filter(s => s.id !== id);
    localStorage.setItem('rekar_sales', JSON.stringify(sales));
    loadData();
  }

  function loadData() {
    const sales = getSales();
    const start = document.getElementById('start-date').value;
    const end = document.getElementById('end-date').value;

    const filtered = sales.filter(s => s.date >= start && s.date <= end);

    let totalQty = 0;
    let totalRev = 0;
    const tbody = document.getElementById('sales-table');
    tbody.innerHTML = '';

    filtered.reverse().forEach(s => {
      totalQty += s.qty;
      totalRev += s.total;

      tbody.innerHTML += `
        <tr>
          <td>${s.date} ${s.time}</td>
          <td>${s.name}</td>
          <td>${s.qty}</td>
          <td>${s.total.toLocaleString()} د.ع</td>
          <td><button class="del-btn" onclick="deleteSale(${s.id})">✕</button></td>
        </tr>
      `;
    });

    document.getElementById('total-sales-count').innerText = totalQty;
    document.getElementById('total-revenue').innerText = totalRev.toLocaleString() + ' د.ع';
  }

  if(sessionStorage.getItem('auth') === '1') {
    showDash();
  }
</script>

</body>
</html>
